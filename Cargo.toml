[package]
name = "cryptofault"
version = "0.1.0"
edition = "2021"
authors = ["Luis Fidel Castellanos Diaz <luis@vectortelemetryresearch.com>"]
description = "Legacy crypto weakness detector for OT/ICS environments"
license = "Apache-2.0"
repository = "https://github.com/LuisCastellanos-dev/cryptofault"
homepage = "https://vectortelemetryresearch.com"
keywords = ["cryptography", "ot-security", "ics", "pcap", "legacy"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
pcap = "2.5.0"
tls-parser = "0.12.2"
x509-parser = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
